# kind cluster used by deploy/Makefile and .github/workflows/deploy-kind.yml.
#  - Default CNI (kindnet) disabled: it does not enforce NetworkPolicy. Calico is installed instead
#    so the NetworkPolicy test is real.
#  - API server audit logging on, so the Sigma rules in deploy/detections can be checked against
#    real audit events. Paths below are relative to the repo root (run kind from there).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kevgate
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            audit-log-maxsize: "100"
            audit-log-maxbackup: "2"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./deploy/kind/audit-policy.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
