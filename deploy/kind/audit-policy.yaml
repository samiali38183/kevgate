# API server audit policy for the kind test cluster. Shaped around the detections in
# deploy/detections: the fields those rules need are logged, secret contents never are.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # High-volume, low-value traffic.
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]
  - level: None
    resources:
      - group: ""
        resources: ["events"]
      - group: coordination.k8s.io
        resources: ["leases"]

  # Secrets and tokens: who touched them, never the payload.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "serviceaccounts/token"]
      - group: authentication.k8s.io
        resources: ["tokenreviews"]

  # Interactive access to a running container.
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/ephemeralcontainers"]

  # Pod specs on write, so privileged/hostPath/hostNetwork settings are visible to detections.
  - level: Request
    verbs: ["create", "update", "patch"]
    resources:
      - group: ""
        resources: ["pods"]
      - group: apps
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - group: batch
        resources: ["jobs", "cronjobs"]

  # RBAC changes are rare and always interesting.
  - level: RequestResponse
    resources:
      - group: rbac.authorization.k8s.io
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]

  - level: Metadata
