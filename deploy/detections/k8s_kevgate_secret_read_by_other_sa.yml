title: kevgate Namespace Secret Read By Unexpected Service Account
id: 53a627a8-f789-417e-866e-f10a394cecc9
status: experimental
description: |
    Detects get, list or watch on Secrets in the kevgate namespace by a service account other than
    kevgate's own. kevgate's service account has no RBAC permissions at all and its token is not
    mounted; the kubelet (system:node:*) mounts the API key Secret. Any other workload identity
    reading Secrets here is either misconfigured RBAC or a stolen token being used to collect
    credentials. Denied attempts (responseStatus.code 403) are matched on purpose: probing is the signal.
references:
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/
    - https://attack.mitre.org/techniques/T1552/007/
author: kevgate
date: 2026-11-10
tags:
    - attack.credential-access
    - attack.t1552.007
logsource:
    product: kubernetes
    service: audit
detection:
    selection:
        verb:
            - 'get'
            - 'list'
            - 'watch'
        objectRef.resource: 'secrets'
        objectRef.namespace: 'kevgate'
        user.username|startswith: 'system:serviceaccount:'
    filter_main_kevgate_sa:
        user.username: 'system:serviceaccount:kevgate:kevgate'
    filter_main_control_plane:
        user.username|startswith: 'system:serviceaccount:kube-system:'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - A secrets operator (External Secrets, Sealed Secrets) added later; add its service account as a filter.
level: high
