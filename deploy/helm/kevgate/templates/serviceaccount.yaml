{{- if .Values.serviceAccount.create -}}
# Identity only. No Role or RoleBinding references this account: kevgate has no Kubernetes API
# permissions, and the token is not mounted (automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kevgate.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
