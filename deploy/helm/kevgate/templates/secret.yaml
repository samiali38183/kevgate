{{- if and .Values.apiKeys.create (not .Values.apiKeys.existingSecret) -}}
# Holds hashed key lines only (key_id:scopes:hash). Plaintext keys are shown once by
# `kevgate keygen` and never stored in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kevgate.apiKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKeys.secretKey }}: |
    {{- range .Values.apiKeys.entries }}
    {{ . }}
    {{- end }}
{{- end }}
