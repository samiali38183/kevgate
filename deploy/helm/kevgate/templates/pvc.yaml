{{- if and (eq .Values.persistence.mode "pvc") (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kevgate.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate.labels" . | nindent 4 }}
  annotations:
    # Keep findings data if the release is uninstalled by mistake.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
