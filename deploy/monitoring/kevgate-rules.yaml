# Prometheus alerting rules for kevgate (plain rules file, `promtool check rules`).
# The PrometheusRule CRD in prometheusrule.yaml carries the same groups; CI checks they match.
#
# Metric names come from src/kevgate/metrics.py (prometheus_client adds _total to counters):
#   kevgate_http_requests_total{method,route,status}
#   kevgate_http_request_duration_seconds_bucket{method,route,le}
#   kevgate_auth_failures_total{reason}       reason = missing | invalid | forbidden
#   kevgate_rate_limited_total
#   kevgate_kev_entries
# Readiness alerts use kube-state-metrics.
# Every alert links to its section in docs/RUNBOOK.md.
groups:
  - name: kevgate.availability
    rules:
      - alert: KevgateHigh5xxRatio
        expr: |
          (
            sum(rate(kevgate_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(kevgate_http_requests_total[5m]))
          ) > 0.05
          and
          sum(rate(kevgate_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          service: kevgate
        annotations:
          summary: "kevgate 5xx ratio above 5% for 5 minutes"
          description: "{{ $value | humanizePercentage }} of kevgate requests are failing with 5xx."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgatehigh5xxratio"

      - alert: KevgateNotReady
        expr: |
          sum(kube_pod_status_ready{namespace="kevgate", pod=~"kevgate-.*", condition="true"}) == 0
        for: 3m
        labels:
          severity: critical
          service: kevgate
        annotations:
          summary: "No kevgate pod is Ready"
          description: "Readiness (/readyz) has failed on every kevgate pod for 3 minutes; the Service has no endpoints."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgatenotready"

      - alert: KevgateScrapeMissing
        expr: |
          absent(up{job="kevgate"} == 1)
        for: 5m
        labels:
          severity: warning
          service: kevgate
        annotations:
          summary: "Prometheus cannot scrape kevgate"
          description: "No successful scrape of job=kevgate for 5 minutes. Either the pod is down or NetworkPolicy blocks Prometheus."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgatescrapemissing"

      - alert: KevgateKevCatalogEmpty
        expr: |
          max(kevgate_kev_entries) == 0
        for: 5m
        labels:
          severity: critical
          service: kevgate
        annotations:
          summary: "kevgate has no KEV catalog loaded"
          description: "Without KEV data every finding is scored as not exploited; the queue order is wrong."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgatekevcatalogempty"

  - name: kevgate.performance
    rules:
      - alert: KevgateHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (rate(kevgate_http_request_duration_seconds_bucket{route!="/metrics"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: kevgate
        annotations:
          summary: "kevgate p95 latency above 500ms on {{ $labels.route }}"
          description: "p95 latency on {{ $labels.route }} is {{ $value | humanizeDuration }} over the last 10 minutes."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgatehighlatencyp95"

  - name: kevgate.security
    rules:
      - alert: KevgateAuthFailureSpike
        expr: |
          sum by (reason) (increase(kevgate_auth_failures_total[5m])) > 25
        for: 5m
        labels:
          severity: warning
          service: kevgate
        annotations:
          summary: "kevgate auth failures spiking ({{ $labels.reason }})"
          description: "{{ $value | humanize }} auth failures with reason={{ $labels.reason }} in 5 minutes. invalid suggests key guessing or a revoked key still in use; forbidden suggests a valid key used outside its scopes."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgateauthfailurespike"

      - alert: KevgateForbiddenScopeUse
        expr: |
          sum(increase(kevgate_auth_failures_total{reason="forbidden"}[10m])) > 0
        labels:
          severity: warning
          service: kevgate
        annotations:
          summary: "A valid kevgate key was used outside its scopes"
          description: "Valid keys only fail with forbidden when used against an endpoint they are not scoped for. One occurrence is worth a look: it is either a misconfigured client or a leaked key being explored."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#suspected-api-key-leak"

      - alert: KevgateRateLimitSpike
        expr: |
          sum(increase(kevgate_rate_limited_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
          service: kevgate
        annotations:
          summary: "kevgate is rate limiting heavily"
          description: "{{ $value | humanize }} requests got 429 in 5 minutes: a client loop, a scanner, or abuse of a key."
          runbook_url: "https://github.com/samiali38183/kevgate/blob/main/docs/RUNBOOK.md#kevgateratelimitspike"
