[project]
name = "kevgate"
version = "0.1.0"
description = "Vulnerability intake service that ranks findings by CISA KEV, EPSS, CVSS and asset criticality"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sami Ali" }]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
kevgate = "kevgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kevgate = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["kevgate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108"]
# M1 contract file is kept byte-for-byte as written in the scaffold.
"tests/test_m1.py" = ["E501"]

[tool.ruff.format]
exclude = ["tests/test_m1.py"]
