# Dependabot opens pull requests for stale dependencies. Actions stay pinned to a commit SHA: for
# SHA-pinned actions Dependabot rewrites the SHA and the version comment together.
#
# requirements.lock is compiled output, not an input Dependabot understands. It is refreshed with
# `bash deploy/scripts/lock.sh refresh`, and .github/workflows/lock-freshness.yml reports when the
# committed lock has fallen behind. Dependabot's pip updates cover the ranges in pyproject.toml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
